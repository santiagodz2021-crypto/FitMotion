<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14202b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Definición">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mi Definición</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mut:#61707d;--line:#dbe1e7;--soft:#f2f5f8;--acc:#1f6f8b;--accink:#fff;--bad:#b42318;--good:#2f855a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1319;--card:#161d26;--ink:#e8eef3;--mut:#93a1ad;--line:#26313d;--soft:#1c2530;--acc:#5ab0cf;--accink:#0e1319;--bad:#f87171;--good:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px;font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:5}
header{background:#14202b;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
h1{font-size:21px;margin:0}.sub{font-size:13px;color:#9fb0bd;margin-top:2px}
nav{display:flex;gap:7px;overflow-x:auto;padding:10px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:20px;padding:9px 14px;white-space:nowrap;font:inherit;font-size:14px}
nav .on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
main{max-width:760px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 6px}p{margin:0 0 8px}
.muted{color:var(--mut);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{font-size:21px;display:block;margin-top:2px}
.next{background:var(--acc);color:var(--accink);border:0}.next h2{font-size:28px;margin:2px 0 12px}.next .btn{background:var(--accink);color:var(--acc)}
label{display:block;color:var(--mut);font-size:13px;margin:8px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--acc);color:var(--accink);font:inherit;font-weight:600}
.secondary{background:var(--soft);color:var(--ink)}.danger{background:var(--bad);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:6px;margin:6px 0 2px}.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:16px;padding:6px 12px;font:inherit;font-size:13px}
.exercise{border-top:1px solid var(--line);padding:14px 0}.exercise:first-of-type{border-top:0}
.hint{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:8px}
.setgrid{display:grid;grid-template-columns:26px 1fr 1fr 1fr;gap:6px;align-items:center}.setgrid input{padding:10px 6px;text-align:center}.setgrid span{font-size:12px;color:var(--mut);text-align:center}
.badge{font-size:11px;font-weight:400;border:1px solid var(--line);border-radius:12px;padding:2px 8px;color:var(--mut);white-space:nowrap}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}.warn{border-left:4px solid var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
td button{border:0;background:none;color:var(--mut);font-size:16px;padding:4px 8px}
.chart{width:100%;height:auto}.chart text{fill:var(--mut);font-size:17px}
#timer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:736px;margin:auto;background:#14202b;color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9;font-size:20px}
#timer[hidden]{display:none}#timer button{border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="top"><header><h1>Mi Definición</h1><div class="sub">Fuerza y composición corporal</div></header><nav id="nav"></nav></div>
<main id="app"></main>
<div id="timer" hidden></div><div id="toast" role="status"></div>
<script>
const INIT={routine:{
"Upper A":[["Press banca",3,"6–10"],["Remo",3,"8–12"],["Press inclinado",3,"8–12"],["Jalón al pecho",3,"8–12"],["Elevaciones laterales",3,"10–15"],["Tríceps",2,"10–15"],["Bíceps",2,"10–15"]],
"Lower A":[["Prensa",3,"8–12"],["Peso muerto rumano",3,"8–12"],["Extensión de cuádriceps",3,"10–15"],["Curl femoral",3,"10–15"],["Gemelos",3,"10–15"],["Abdomen",3,"10–20"]],
"Upper B":[["Press inclinado",3,"6–10"],["Jalón/dominadas",3,"8–12"],["Press de hombro",3,"8–12"],["Remo",3,"8–12"],["Elevaciones laterales",3,"10–15"],["Tríceps",2,"10–15"],["Bíceps",2,"10–15"]],
"Lower B":[["Prensa",3,"8–12"],["Peso muerto rumano",3,"8–12"],["Extensión de cuádriceps",3,"10–15"],["Curl femoral",3,"10–15"],["Gemelos",3,"10–15"],["Abdomen",3,"10–20"]]
},weights:[],waist:[],workouts:[]};
const ORDER=["Upper A","Lower A","Upper B","Lower B"],TABS=["Inicio",...ORDER,"Progreso","Historial","Datos"],DAY=864e5;
const $=s=>document.querySelector(s),app=$("#app"),navEl=$("#nav");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const t=new Date();return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const clone=x=>JSON.parse(JSON.stringify(x));
function migrate(x){x=x&&typeof x==="object"?x:{};if(!x.routine||!Object.keys(x.routine).length)x.routine=clone(INIT.routine);
 ["weights","waist","workouts"].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});x.workouts.forEach((w,i)=>{w.id=w.id||Date.now()+i;w.sets=w.sets||[]});return x}
let d;try{d=migrate(JSON.parse(localStorage.getItem("md")))}catch{d=migrate(null)}
let dr={};try{dr=JSON.parse(localStorage.getItem("md_draft")||"{}")}catch{}
let tab="Inicio";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2600)}
function save(){try{localStorage.setItem("md",JSON.stringify(d));return true}catch{toast("No se pudo guardar. Exporta una copia y libera espacio.");return false}}
const saveDr=()=>{try{localStorage.setItem("md_draft",JSON.stringify(dr))}catch{}};

/* ---------- lógica ---------- */
function last(name,ex){for(let i=d.workouts.length-1;i>=0;i--){const w=d.workouts[i];if(w.name===name){const s=w.sets.filter(x=>x.exercise===ex);if(s.length)return s}}return null}
function suggest(e,L){
 const [lo,hi]=e[2].split("–").map(Number),top=Math.max(...L.map(s=>s.kg));
 const all=L.length>=e[1]&&L.every(s=>s.reps>=hi),easy=L.every(s=>s.rir==null||s.rir>=1),low=L.some(s=>s.reps>0&&s.reps<lo);
 const tip=all&&easy?`sube a ${top+2.5} kg`:low?`mantén ${top} kg hasta llegar a ${lo} reps`:`mantén ${top} kg y busca +1 rep por serie`;
 return `Última vez: ${L.map(s=>s.kg+"×"+s.reps).join(", ")}. Hoy: ${tip}.`}
function trend(a){
 if(a.length<3)return null;const t1=Date.parse(a.at(-1).date),p=a.filter(x=>t1-Date.parse(x.date)<=14*DAY);if(p.length<3)return null;
 const xs=p.map(x=>(Date.parse(x.date)-t1)/DAY),ys=p.map(x=>x.kg),n=p.length,mx=xs.reduce((s,x)=>s+x)/n,my=ys.reduce((s,x)=>s+x)/n,den=xs.reduce((s,x)=>s+(x-mx)**2,0);
 if(den<4)return null;const sl=xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0)/den*7;return{kg:sl,pct:sl/my*100}}
function verdict(t){
 if(!t)return "Faltan datos: necesito al menos 3 pesajes en 14 días. Pésate a la misma hora y en condiciones parecidas.";
 const p=-t.pct;return p<.25?"Tendencia plana o al alza. Si llevas 2 semanas o más así, revisa la ingesta.":p<=1?"Ritmo razonable para perder grasa conservando músculo.":"Ritmo alto (más de 1 % del peso por semana): riesgo de perder músculo y rendimiento."}
const sgn=n=>(n>0?"+":n<0?"−":"")+Math.abs(n).toFixed(1);

/* ---------- gráficas ---------- */
function chart(a,key,u){
 if(a.length<2)return `<p class="muted">Registra al menos 2 valores para ver la gráfica.</p>`;
 const t=a.map(p=>Date.parse(p.date)),v=a.map(p=>p[key]),
 ma=v.map((_,i)=>{const w=v.filter((_,j)=>j<=i&&t[i]-t[j]<7*DAY);return w.reduce((s,x)=>s+x,0)/w.length}),
 lo=Math.min(...v),hi=Math.max(...v),pad=Math.max((hi-lo)*.15,.5),mn=lo-pad,mx=hi+pad,t0=t[0],span=Math.max(t.at(-1)-t0,DAY),
 W=700,H=250,L=56,R=12,T=12,B=30,X=x=>(L+(x-t0)/span*(W-L-R)).toFixed(1),Y=y=>(T+(mx-y)/(mx-mn)*(H-T-B)).toFixed(1);
 const grid=[0,1,2,3].map(i=>{const y=mn+(mx-mn)*i/3;return `<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${L-8}" y="${+Y(y)+6}" text-anchor="end">${y.toFixed(1)}</text>`}).join("");
 const path=ma.map((y,i)=>`${i?"L":"M"}${X(t[i])},${Y(y)}`).join("");
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Evolución (${u})">${grid}<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="3"/>${v.map((y,i)=>`<circle cx="${X(t[i])}" cy="${Y(y)}" r="4" fill="var(--mut)"/>`).join("")}<text x="${L}" y="${H-6}">${a[0].date.slice(5)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${a.at(-1).date.slice(5)}</text></svg><p class="muted">Puntos: registros. Línea: media móvil de 7 días (${u}).</p>`}

/* ---------- vistas ---------- */
function nav(){navEl.innerHTML=TABS.map(x=>`<button class="${tab===x?"on":""}" onclick="go('${x}')">${x}</button>`).join("")}
function go(x){tab=x;nav();render();scrollTo(0,0)}
function render(){tab==="Inicio"?home():d.routine[tab]?train(tab):tab==="Progreso"?progress():tab==="Historial"?history():settings()}
function home(){
 const w=d.weights.at(-1),z=d.waist.at(-1),t=trend(d.weights),lw=d.workouts.at(-1),nx=ORDER[(ORDER.indexOf(lw?.name)+1)%4],
 wk=d.workouts.filter(x=>Date.now()-Date.parse(x.date)<=7*DAY).length,ex=localStorage.getItem("md_export"),
 stale=(d.weights.length||d.workouts.length)&&(!ex||Date.now()-Date.parse(ex)>14*DAY);
 app.innerHTML=`<section class="card next"><span class="muted" style="color:inherit;opacity:.8">${lw?"Siguiente sesión":"Empieza por"}</span><h2>${nx}</h2><button class="btn" onclick="go('${nx}')">Entrenar</button></section>
 ${stale?`<section class="card warn"><h3>Haz una copia de seguridad</h3><p class="muted">Tus datos viven solo en este dispositivo. ${ex?"Tu última copia es del "+ex+".":"Aún no has exportado ninguna copia."}</p><button class="btn secondary" onclick="go('Datos')">Ir a Datos</button></section>`:""}
 <section class="card"><h2>Resumen</h2><div class="grid">
 <div class="stat"><span class="muted">Peso</span><b>${w?w.kg+" kg":"—"}</b></div>
 <div class="stat"><span class="muted">Cintura</span><b>${z?z.cm+" cm":"—"}</b></div>
 <div class="stat"><span class="muted">Ritmo (14 días)</span><b>${t?sgn(t.kg)+" kg/sem":"—"}</b></div>
 <div class="stat"><span class="muted">Sesiones (7 días)</span><b>${wk}</b></div></div>
 <div class="note" style="margin-top:10px">${verdict(t)}</div></section>
 <section class="card"><h2>Registrar peso</h2><div class="grid"><div><label for="wd">Fecha</label><input id="wd" type="date" value="${today()}"></div><div><label for="wk">Kg</label><input id="wk" type="number" inputmode="decimal" step=".1" placeholder="90.0"></div></div><div class="actions"><button class="btn" onclick="addM('weights','kg','wd','wk',30,300)">Guardar peso</button></div></section>
 <section class="card"><h2>Registrar cintura</h2><div class="grid"><div><label for="zd">Fecha</label><input id="zd" type="date" value="${today()}"></div><div><label for="zk">cm</label><input id="zk" type="number" inputmode="decimal" step=".1"></div></div><div class="actions"><button class="btn" onclick="addM('waist','cm','zd','zk',30,200)">Guardar cintura</button></div></section>`}
function addM(k,f,di,vi,lo,hi){
 const x=parseFloat($("#"+vi).value),dt=$("#"+di).value;
 if(!dt)return toast("Elige una fecha");if(!(x>=lo&&x<=hi))return toast(`Introduce un valor entre ${lo} y ${hi}`);
 d[k]=d[k].filter(p=>p.date!==dt);d[k].push({date:dt,[f]:x});d[k].sort((a,b)=>a.date.localeCompare(b.date));if(save()){toast("Guardado");render()}}
function delM(k,dt){if(!confirm("¿Borrar el registro del "+dt+"?"))return;d[k]=d[k].filter(p=>p.date!==dt);save();render()}
function train(n){
 const ex=d.routine[n],D=dr[n]||{};
 app.innerHTML=`<section class="card"><h2>${n}</h2><p class="muted">RIR: repeticiones que te quedaban en reserva. En gris, tu última sesión.</p>
 <div class="chips">${[60,90,120,180].map(s=>`<button class="chip" onclick="rest(${s})">Descanso ${s} s</button>`).join("")}</div>
 ${ex.map((e,i)=>{const L=last(n,e[0]);return `<div class="exercise"><h3>${esc(e[0])} <span class="badge">${e[2]} reps · ${e[1]} series</span></h3>${L?`<div class="hint">${suggest(e,L)}</div>`:""}
 <div class="setgrid"><span></span><span>kg</span><span>reps</span><span>RIR</span>${Array.from({length:e[1]},(_,s)=>{const p=L&&(L[s]||L.at(-1));
 return `<span>${s+1}</span>`+[["k",p?.kg,'step=".5"'],["r",p?.reps,""],["q",p?.rir,'min="0" max="6"']].map(([c,ph,at])=>`<input data-f="${c}${i}_${s}" type="number" inputmode="decimal" ${at} placeholder="${ph??""}" value="${D[c+i+"_"+s]??""}">`).join("")}).join("")}</div></div>`}).join("")}
 <label for="nt">Notas</label><textarea id="nt" data-f="nt" rows="3" placeholder="Técnica, energía, molestias…">${esc(D.nt||"")}</textarea>
 <div class="actions"><button class="btn" onclick="saveT('${n}')">Guardar sesión</button><button class="btn secondary" onclick="clearT('${n}')">Vaciar</button></div></section>
 <section class="card"><h3>Regla de progresión</h3><p class="note">Cuando completas el máximo del rango en todas las series y te quedaba al menos 1 repetición en reserva, sube 2,5 kg. Si no llegas al mínimo del rango, mantén el peso.</p></section>`}
app.addEventListener("input",e=>{const f=e.target.dataset.f;if(f&&d.routine[tab]){(dr[tab]??={})[f]=e.target.value;saveDr()}});
function clearT(n){if(!confirm("¿Vaciar los datos sin guardar de esta sesión?"))return;delete dr[n];saveDr();render()}
function saveT(n){
 const sets=[],num=(s,i)=>{const v=$(`[data-f="${s}"]`).value;return v===""?null:i?parseInt(v):parseFloat(v)};
 d.routine[n].forEach((e,i)=>{for(let s=0;s<e[1];s++){const kg=num(`k${i}_${s}`),rp=num(`r${i}_${s}`,1),ri=num(`q${i}_${s}`,1);
  if(kg||rp)sets.push({exercise:e[0],set:s+1,kg:kg||0,reps:rp||0,rir:ri})}});
 if(!sets.length)return toast("Introduce al menos una serie");
 d.workouts.push({id:Date.now(),date:today(),name:n,sets,notes:$("#nt").value});
 if(save()){delete dr[n];saveDr();toast("Sesión guardada");go("Inicio")}}
let tm;
function rest(s){clearInterval(tm);const e=Date.now()+s*1e3,b=$("#timer");b.hidden=false;
 const tick=()=>{const l=Math.ceil((e-Date.now())/1e3);if(l<=0){clearInterval(tm);b.innerHTML=`<b>Descanso terminado</b><button onclick="stopT()">Cerrar</button>`;navigator.vibrate?.([200,100,200]);return}
  b.innerHTML=`<b>${Math.floor(l/60)}:${String(l%60).padStart(2,"0")}</b><button onclick="stopT()">Parar</button>`};tick();tm=setInterval(tick,250)}
function stopT(){clearInterval(tm);$("#timer").hidden=true}
function tbl(k,f,u){const a=d[k];return a.length?`<table><tr><th>Fecha</th><th>Valor</th><th></th></tr>${a.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x[f]} ${u}</td><td><button aria-label="Borrar" onclick="delM('${k}','${x.date}')">✕</button></td></tr>`).join("")}</table>`:`<p class="muted">Sin registros todavía. Añádelos desde Inicio.</p>`}
function progress(){
 const pr={};d.workouts.forEach(w=>w.sets.forEach(s=>{if(s.kg>0&&s.reps>0&&s.reps<=12){const e=s.kg*(1+s.reps/30);if(!pr[s.exercise]||e>pr[s.exercise].e)pr[s.exercise]={e,kg:s.kg,reps:s.reps,date:w.date}}}));
 const rows=Object.entries(pr).sort((a,b)=>a[0].localeCompare(b[0]));
 app.innerHTML=`<section class="card"><h2>Peso</h2>${chart(d.weights,"kg","kg")}</section>
 <section class="card"><h2>Cintura</h2>${chart(d.waist,"cm","cm")}</section>
 <section class="card"><h2>Mejores marcas</h2>${rows.length?`<table><tr><th>Ejercicio</th><th>Mejor serie</th><th>1RM est.</th></tr>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.kg}×${v.reps}</td><td>${v.e.toFixed(1)} kg</td></tr>`).join("")}</table><p class="muted" style="margin-top:8px">1RM estimado con la fórmula de Epley, solo series de 12 reps o menos.</p>`:`<p class="muted">Guarda sesiones para ver tus mejores marcas.</p>`}</section>
 <section class="card"><h2>Pesos registrados</h2>${tbl("weights","kg","kg")}</section>
 <section class="card"><h2>Cintura registrada</h2>${tbl("waist","cm","cm")}</section>`}
function history(){
 app.innerHTML=d.workouts.length?d.workouts.slice().reverse().map(w=>{const g={};w.sets.forEach(s=>(g[s.exercise]??=[]).push(s));
  return `<section class="card"><h2>${esc(w.name)} <span class="badge">${w.date}</span></h2>${Object.entries(g).map(([k,v])=>`<p><b>${esc(k)}</b><br><span class="muted">${v.map(s=>s.kg+"×"+s.reps+(s.rir!=null?" @"+s.rir:"")).join(" · ")}</span></p>`).join("")}${w.notes?`<div class="note">${esc(w.notes)}</div>`:""}<div class="actions"><button class="btn secondary" onclick="delW(${w.id})">Borrar sesión</button></div></section>`}).join(""):`<section class="card"><h2>Historial</h2><p class="muted">Aún no has guardado ninguna sesión. Elige una rutina y registra tus series.</p></section>`}
function delW(id){if(!confirm("¿Borrar esta sesión?"))return;d.workouts=d.workouts.filter(w=>w.id!==id);save();render()}
function settings(){
 app.innerHTML=`<section class="card"><h2>Datos</h2><p class="muted">Todo se guarda en este dispositivo. Exporta una copia con regularidad, sobre todo si usas la app desde Safari sin instalarla.</p>
 <div class="actions"><button class="btn" onclick="exportD()">Exportar copia</button><label class="btn secondary" style="margin:0">Importar copia<input type="file" accept=".json" onchange="importD(event)" hidden></label><button class="btn danger" onclick="wipe()">Borrar todo</button></div></section>
 <section class="card"><h2>Rutina actual</h2>${Object.entries(d.routine).map(([k,v])=>`<h3>${k}</h3><p class="muted">${v.map(e=>esc(e[0])+" "+e[1]+"×"+e[2]).join(" · ")}</p>`).join("")}</section>`}
function exportD(){const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download=`mi-definicion-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1e3);localStorage.setItem("md_export",today());toast("Copia exportada")}
function importD(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x!=="object"||!x.routine||!Array.isArray(x.weights))throw 0;
  if(!confirm("Se reemplazarán los datos actuales por los de la copia. ¿Continuar?"))return;d=migrate(x);save();toast("Copia importada");render()}catch{toast("Archivo no válido: no parece una copia de esta app")}};r.readAsText(f)}
function wipe(){if(!confirm("¿Borrar todos los registros? No se puede deshacer."))return;d=migrate(null);dr={};save();saveDr();render()}
nav();render();
navigator.storage?.persist?.();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
